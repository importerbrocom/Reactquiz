# Static frontend (Option A: served from same server)
# For Option B, the frontend is on Cloudflare Pages / S3+CloudFront instead.

server {
    listen 80;
    server_name app.quizpath.com;
    root /var/www/quizpath/web/dist;
    index index.html;

    # Immutable hashed assets — 1 year cache
    location ~* \.(?:js|css|woff2|avif|webp|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker and index — no cache (always fresh)
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
