<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4F46E5" />
  <title>ERO — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #0B1120;
      color: #f8fafc;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 700;
      color: #818cf8;
      margin-bottom: 1.5rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 1rem;
      background: rgba(79, 70, 229, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 40px;
      height: 40px;
      stroke: #818cf8;
      fill: none;
      stroke-width: 1.5;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.75rem;
    }
    p {
      color: #94a3b8;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 0.5rem;
    }
    .note {
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.25);
    }
    .note p {
      color: #a5b4fc;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">ERO</div>
    <div class="icon">
      <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.364 5.636a9 9 0 11-12.728 0M12 9v4m0 4h.01"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>
      It looks like you've lost your internet connection.
      Don't worry — any answers you saved will sync automatically
      when you're back online.
    </p>
    <div class="note">
      <p>
        Your progress is safe. Answers saved locally will be
        sent to the server as soon as connectivity returns.
      </p>
    </div>
  </div>
</body>
</html>
